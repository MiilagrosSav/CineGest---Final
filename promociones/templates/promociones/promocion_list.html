{% extends "accounts/base.html" %}

{% block title %}Promociones{% endblock %}

{% block content %}
<div class="container" style="max-width: 1200px; margin: 2rem auto;">
    
    <div class="mb-lg">
        <h1 class="card-title text-gradient-primary" style="margin-bottom: 0;">Promociones</h1>
    </div>

    <div class="card glass-container">
        
        {# Barra de Filtros #}
        <div style="padding: var(--space-sm) var(--space-md); border-bottom: 1px solid var(--glass-border);">
            <form method="get" id="form-filtros" style="display: flex; gap: var(--space-xs); align-items: center; justify-content: space-between; flex-wrap: wrap;">
                <div style="position: relative; min-width: 180px; max-width: 250px;">
                    <input type="text" 
                           name="search" 
                           id="search-input"
                           value="{{ filtro_search }}"
                           placeholder=" Nombre o código..."
                           title="Buscar por nombre o código de promoción"
                           class="form-input"
                           style="width: 100%; padding: 0.4rem 0.4rem 0.4rem 2rem; font-size: 0.9rem;">
                    <span style="position: absolute; left: 0.5rem; top: 50%; transform: translateY(-50%); font-size: 1rem; opacity: 0.5;">🔍</span>
                </div>
                
                <div style="display: flex; gap: var(--space-xs); align-items: center; flex-wrap: wrap;">
                    <select name="tipo" class="form-select" style="width: 150px; padding: 0.4rem; font-size: 0.9rem;">
                        <option value="">Todos los tipos</option>
                        <option value="auto" {% if filtro_tipo == 'auto' %}selected{% endif %}>🛒 Automáticas</option>
                        <option value="cupon" {% if filtro_tipo == 'cupon' %}selected{% endif %}>📧 Cupones</option>
                    </select>
                    
                    <button type="button" id="btn-filter" class="btn btn-primary" style="padding: 0.35rem 0.6rem; font-size:0.85rem;">Buscar</button>
                    
                    {% if filtro_search or filtro_tipo %}
                    <a href="{% url 'promociones:promocion_list' %}" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">
                        ✕
                    </a>
                    {% endif %}
                </div>
            </form>
        </div>
        
        <div id="promocionTableContainer" style="padding: var(--space-md);">
            {% include 'promociones/_promocion_table.html' %}
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-md); padding: var(--space-md); border-top: 1px solid var(--glass-border);">
            
            <div>
                <a href="{% url 'promociones:promocion_create' %}" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.9rem;">
                    ✚ Crear Promoción
                </a>
            </div>
            
            <div style="display: flex; gap: var(--space-sm);">
                <button id="btn-modificar" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.9rem;" disabled>
                    ✏️ Modificar
                </button>
                <button id="btn-eliminar" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.9rem;" disabled>
                    🗑️ Eliminar
                </button>
            </div>
        </div>

    </div>
</div>

<style>
    /* --- Estilos para la Barra de Botones --- */
    #promocionTableContainer + div .btn,
    #promocionTableContainer + div .btn-primary,
    #promocionTableContainer + div .btn-outline {
        padding: 0.7rem 1.3rem;
        font-size: 0.9rem; 
        font-weight: 600;
        border-radius: 9999px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-width: 2px;
        transition: all 0.3s ease-in-out;
        position: relative;
        overflow: hidden;
    }
    
    #promocionTableContainer + div .btn-primary:hover {
        background: rgb(77, 19, 92);
        color: white;
        border: none;
    }
    #promocionTableContainer + div .btn-outline:not(:disabled):hover {
        background: rgba(var(--primary-rgb), 0.25);
        border-color: var(--primary);
        color: var(--primary);
        transform: translateY(-1px) scale(1.01);
        box-shadow: 0 4px 10px rgba(var(--primary-rgb), 0.2);
    }
    #promocionTableContainer + div .btn-outline:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        background: transparent;
        border-color: var(--glass-border);
        color: var(--text-secondary);
        transform: none;
        box-shadow: none;
    }
    .btn:disabled,
    .btn-outline:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* --- Estilos de Fila --- */
    .promocion-row {
        transition: background-color 0.2s ease;
    }
    .promocion-row:hover {
        background-color: rgba(255, 255, 255, 0.05);
    }
    .promocion-row.selected {
        background-color: rgba(var(--primary-rgb), 0.15);
        border-left: 3px solid var(--primary);
    }

    /* --- Badges --- */
    .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: 500;
    }
    
    /* Badges de TIPO: AUTO vs CUPÓN */
    .badge-auto {
        background: rgba(168, 85, 247, 0.15);
        color: #a855f7;
        border: 1px solid rgba(168, 85, 247, 0.3);
        font-weight: 600;
    }
    .badge-cupon {
        background: rgba(170, 170, 170, 0.15);
        color: #aaa;
        border: 1px solid rgba(170, 170, 170, 0.3);
        font-weight: 600;
    }
    
    /* Badges de TIPO DESCUENTO */
    .badge-tipo-porcentaje { background: rgba(76, 175, 80, 0.2); color: #81c784; }
    .badge-tipo-2x1 { background: rgba(255, 152, 0, 0.2); color: #ffb74d; }
    .badge-tipo-monto_fijo { background: rgba(33, 150, 243, 0.2); color: #64b5f6; }
    
    /* Mini-badges de DÍAS (pequeños y oscuros) */
    .day-badge {
        display: inline-block;
        padding: 0.2rem 0.5rem;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #e0e0e0;
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    /* Badge de Género (heredado de otros templates) */
    .genre-badge {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-radius: 50px;
        background: rgba(139, 95, 191, 0.15);
        border: 1px solid rgba(139, 95, 191, 0.3);
        color: #e0e0e0;
        white-space: nowrap;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const btnModificar = document.getElementById('btn-modificar');
        const btnEliminar = document.getElementById('btn-eliminar');
        let selectedRows = [];

        // Función para adjuntar listeners a las filas
        function attachRowListeners(container) {
            if (!container) container = document;
            const rows = container.querySelectorAll('.promocion-row');
            rows.forEach(row => {
                row.addEventListener('click', function(event) {
                    if (!event.ctrlKey && !event.metaKey) {
                        document.querySelectorAll('.promocion-row.selected').forEach(r => {
                            if (r !== this) r.classList.remove('selected');
                        });
                        selectedRows = [];
                    }
                    toggleRowSelection(this);
                });
            });
        }

        function updateUI() {
            if (!btnModificar || !btnEliminar) return;
            btnModificar.disabled = selectedRows.length !== 1;
            btnEliminar.disabled = selectedRows.length === 0;
            
            if (selectedRows.length > 0) {
                btnEliminar.textContent = `🗑️ Eliminar ${selectedRows.length > 1 ? `(${selectedRows.length})` : ''}`;
            } else {
                btnEliminar.textContent = '🗑️ Eliminar';
            }
        }
        
        function toggleRowSelection(row) {
            const rowId = row.dataset.id;
            if (row.classList.contains('selected')) {
                row.classList.remove('selected');
                selectedRows = selectedRows.filter(id => id !== rowId);
            } else {
                row.classList.add('selected');
                selectedRows.push(rowId);
            }
            updateUI();
        }

        // Inicializar listeners en la carga inicial
        attachRowListeners();

        // --- FILTROS CON AJAX ---
        const searchInput = document.getElementById('search-input');
        const btnFilter = document.getElementById('btn-filter');
        const formFiltros = document.getElementById('form-filtros');

        function serializeForm() {
            const form = document.getElementById('form-filtros');
            const params = new URLSearchParams(new FormData(form));
            return params.toString();
        }

        let searchTimeout = null;
        function fetchTable(push=true) {
            const qs = serializeForm();
            const url = window.location.pathname + (qs ? ('?' + qs) : '');
            const container = document.getElementById('promocionTableContainer');
            if (!container) return;
            container.style.opacity = '0.6';
            fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
                .then(r => { if (!r.ok) throw new Error('Network response not ok'); return r.text(); })
                .then(html => {
                    container.innerHTML = html;
                    attachRowListeners(container);
                    selectedRows = [];
                    updateUI();
                    if (push) history.pushState(null, '', url);
                })
                .catch(err => { console.error('AJAX error', err); })
                .finally(()=>{ container.style.opacity = ''; });
        }

        function fetchTableDebounced() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => fetchTable(true), 500);
        }

        if (searchInput) {
            searchInput.addEventListener('input', function(e) {
                fetchTableDebounced();
            });
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    clearTimeout(searchTimeout);
                    fetchTable(true);
                }
            });
        }

        if (btnFilter) {
            btnFilter.addEventListener('click', function() { 
                clearTimeout(searchTimeout); 
                fetchTable(true); 
            });
        }

        const allSelects = document.querySelectorAll('#form-filtros select');
        allSelects.forEach(select => {
            select.addEventListener('change', function() {
                clearTimeout(searchTimeout);
                fetchTable(true);
            });
        });

        // Manejar botón atrás del navegador
        window.addEventListener('popstate', function() {
            fetchTable(false);
        });

        // --- BOTONES DE ACCIÓN ---
        if(btnModificar) btnModificar.addEventListener('click', function() {
            if (selectedRows.length === 1) {
                const row = document.querySelector(`.promocion-row[data-id="${selectedRows[0]}"]`);
                if (row) {
                    const url = row.getAttribute('data-edit-url');
                    if (url) window.location.href = url;
                }
            }
        });
        
        if(btnEliminar) btnEliminar.addEventListener('click', function() {
            if (selectedRows.length === 0) return;
            
            if (selectedRows.length === 1) {
                const row = document.querySelector(`.promocion-row[data-id="${selectedRows[0]}"]`);
                if (row) {
                    const url = row.getAttribute('data-delete-url');
                    if (url) window.location.href = url;
                }
            } else {
                if (confirm(`¿Estás seguro de que deseas eliminar ${selectedRows.length} promociones seleccionadas?`)) {
                    alert('Función de eliminación masiva en desarrollo');
                }
            }
        });
        
        updateUI();
    });
</script>
{% endblock %}
