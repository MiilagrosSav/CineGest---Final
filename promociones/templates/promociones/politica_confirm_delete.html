{% extends "accounts/base.html" %}

{% block title %}Confirmar Eliminación{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; text-align: center;">

    <div class="mb-lg">
        <h1 class="card-title text-gradient-secondary" style="margin-bottom: 0;">🗑️ ¿Estás seguro?</h1>
        <p class="card-subtitle">
            Estás a punto de eliminar permanentemente la política:
        </p>
    </div>

    <div class="card glass-container text-center">
        <div style="padding: var(--space-lg);">
            
            <div style="margin-bottom: var(--space-lg);">
                <p style="font-size: 1.2rem; font-weight: 600; margin-bottom: var(--space-sm);">
                    "{{ object.nombre }}"
                </p>
            </div>

            <p class="text-secondary" style="font-weight: 600;">Esta acción no se puede deshacer.</p>

            <form method="post">
                {% csrf_token %}
                <div style="display: flex; gap: var(--space-md); margin-top: var(--space-lg); justify-content: center; flex-wrap: wrap;">
                    <button type="submit" class="btn btn-secondary">
                        Sí, Eliminar
                    </button>
                    <a href="{% url 'promociones:politica_list' %}" class="btn btn-outline">
                        No, Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .card .btn-primary,
    .card .btn-secondary,
    .card .btn-outline {
        padding: 0.8rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 9999px; /* Píldora */
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-width: 2px;
        transition: all 0.3s ease;
        min-width: 180px; /* Ancho mínimo */
        text-decoration: none; 
        display: inline-flex; 
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }

    /* Botón "No, Cancelar" (Outline) */
    .card .btn-outline:hover {
        background: rgba(var(--primary-rgb), 0.25);
        border-color: var(--primary);
        color: var(--primary);
        transform: translateY(-1px);
    }

    /* Botón "Sí, Eliminar" (Secondary/Danger) */
    .card .btn-secondary {
        --danger-color: #ff6b6b;
        --danger-rgb: 255, 107, 107;
        background-color: var(--danger-color);
        border-color: var(--danger-color);
        color: #FFF;
    }
    .card .btn-secondary:hover {
        background-color: transparent;
        border-color: var(--danger-color);
        color: var(--danger-color);
        transform: translateY(-1px);
        box-shadow: 0 4px 15px rgba(var(--danger-rgb), 0.4);
    }
</style>
{% endblock %}
