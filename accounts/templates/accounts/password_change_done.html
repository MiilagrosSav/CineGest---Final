{% extends "accounts/base.html" %}

{% block title %}Contraseña Actualizada - {{ configuracion_cine.nombre|default:"CineGest" }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 2rem auto;">
    <div class="card glass-container" style="text-align: center; padding: 3rem 2rem;">
        <div style="font-size: 4rem; margin-bottom: 1rem;">✅</div>
        <h1 class="card-title text-gradient-primary" style="margin-bottom: 1rem;">¡Contraseña Actualizada!</h1>
        <p class="card-subtitle" style="margin-bottom: 2rem;">
            Tu contraseña ha sido cambiada exitosamente.
        </p>
        
        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="{% url 'accounts:dashboard' %}" class="btn btn-primary">
                🏠 Ir al Dashboard
            </a>
            <a href="{% url 'accounts:profile_edit' %}" class="btn btn-outline">
                👤 Ver Perfil
            </a>
        </div>
    </div>
</div>
{% endblock %}
