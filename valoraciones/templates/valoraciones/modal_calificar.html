<style>
    :root {
        --primary-color: #4f46e5; /* Indigo moderno */
        --star-color-inactive: #e5e7eb;
        --star-color-active: #fbbf24; /* Amber/Gold */
        --bg-card: #ffffff;
        --text-main: #1f2937;
        --border-color: #d1d5db;
    }

    .rating-card {
        background-color: var(--bg-card);
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        margin: 0 auto;
        font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .rating-header {
        text-align: center;
        margin-bottom: 1.5rem;
    }

    .rating-header h3 {
        margin: 0;
        font-size: 1.25rem;
        color: var(--text-main);
        font-weight: 600;
    }

    .rating-header p {
        margin: 0.5rem 0 0;
        color: #6b7280;
        font-size: 0.9rem;
    }

    /* Contenedor de estrellas */
    .stars-container {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
    }

    .star {
        background: transparent;
        border: none;
        font-size: 2.5rem;
        cursor: pointer;
        line-height: 1;
        color: var(--star-color-inactive);
        transition: transform 0.2s ease, color 0.2s ease;
        padding: 0;
    }

    .star:hover {
        transform: scale(1.2);
    }

    .star.selected, 
    .star.hover {
        color: var(--star-color-active);
        filter: drop-shadow(0 0 2px rgba(251, 191, 36, 0.5));
    }

    /* Textarea moderno */
    .custom-textarea {
        width: 100%;
        padding: 1rem;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background-color: #f9fafb;
        resize: vertical;
        min-height: 100px;
        font-family: inherit;
        font-size: 0.95rem;
        transition: all 0.2s;
        outline: none;
        color: var(--text-main);
    }

    .custom-textarea:focus {
        background-color: #fff;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .custom-textarea::placeholder {
        color: #9ca3af;
    }

    /* Botones */
    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.75rem;
        margin-top: 1.5rem;
    }

    .btn-custom {
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        font-weight: 500;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
    }

    .btn-cancel {
        background-color: transparent;
        color: #6b7280;
    }
    .btn-cancel:hover {
        background-color: #f3f4f6;
        color: #1f2937;
    }

    .btn-submit {
        background-color: var(--primary-color);
        color: white;
        box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
    }
    .btn-submit:hover {
        background-color: #4338ca;
        transform: translateY(-1px);
    }

    /* Popup de éxito/error personalizado */
    .success-popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        animation: fadeIn 0.3s forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } from { opacity: 0; } }

    .success-popup {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 2.5rem;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        text-align: center;
        max-width: 400px;
        width: 90%;
        transform: scale(0.8);
        animation: popIn 0.3s forwards;
    }

    @keyframes popIn { to { transform: scale(1); } }

    .success-popup-icon { font-size: 4rem; margin-bottom: 1rem; animation: bounce 0.6s; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

    .success-popup-title { color: white; font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .success-popup-message { color: rgba(255, 255, 255, 0.95); font-size: 1rem; margin-bottom: 1.5rem; line-height: 1.5; }
    
    .success-popup-btn {
        background-color: white;
        color: #667eea;
        padding: 0.75rem 2rem;
        border-radius: 50px;
        border: none;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .success-popup-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3); }
</style>

<div class="rating-card">
    <div class="rating-header">
        <h3>¿Qué te pareció?</h3>
        <p>Comparte tu experiencia con nosotros</p>
    </div>

    <form method="post" action="{% url 'valoraciones:registrar_valoracion' %}" class="valoracion-form">
        {% csrf_token %}
        <input type="hidden" name="funcion_id" value="{{ funcion.id }}">
        
        <div class="rating-wrapper">
            <div class="stars-container stars" aria-label="Puntuación">
                <button type="button" class="star" data-value="1" aria-label="1 estrella">★</button>
                <button type="button" class="star" data-value="2" aria-label="2 estrellas">★</button>
                <button type="button" class="star" data-value="3" aria-label="3 estrellas">★</button>
                <button type="button" class="star" data-value="4" aria-label="4 estrellas">★</button>
                <button type="button" class="star" data-value="5" aria-label="5 estrellas">★</button>
            </div>

            <input type="hidden" name="estrellas" value="5">

            <textarea name="comentario" 
                      class="custom-textarea"
                      rows="4" 
                      maxlength="500" 
                      placeholder="Cuéntanos más sobre tu experiencia (opcional)..."></textarea>

            <div class="form-actions">
                <button type="button" class="btn-custom btn-cancel" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn-custom btn-submit">Publicar reseña</button>
            </div>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
    // Inicializar cada formulario de valoración
    document.querySelectorAll('.valoracion-form').forEach(form => {
        const stars = Array.from(form.querySelectorAll('.star'));
        const estrellasInput = form.querySelector('[name="estrellas"]');
        let selected = parseInt(estrellasInput.value) || 5;

        // Pintar estrellas
        function paint(upTo){
            stars.forEach(s => {
                const v = parseInt(s.getAttribute('data-value'));
                if (v <= upTo) {
                    s.classList.add('selected');
                } else {
                    s.classList.remove('selected');
                }
            });
        }

        paint(selected);

        // Eventos de estrellas
        stars.forEach(s => {
            s.addEventListener('mouseenter', () => {
                paint(parseInt(s.getAttribute('data-value')));
            });
            s.addEventListener('mouseleave', () => {
                paint(selected);
            });
            s.addEventListener('click', () => {
                selected = parseInt(s.getAttribute('data-value'));
                estrellasInput.value = selected;
                paint(selected);
                // Animación click
                s.style.transform = "scale(1.4)";
                setTimeout(() => s.style.transform = "", 200);
            });
        });

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Submit AJAX
        form.addEventListener('submit', async function(e){
            e.preventDefault();
            const action = form.getAttribute('action');
            const formData = new FormData(form);
            const csrftoken = getCookie('csrftoken');

            if (!csrftoken) {
                console.error('No se encontró el token CSRF');
                mostrarPopupError('Error de configuración: token CSRF no disponible.');
                return;
            }

            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Enviando...';
            submitBtn.disabled = true;

            try {
                const resp = await fetch(action, {
                    method: 'POST',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'X-CSRFToken': csrftoken
                    },
                    credentials: 'same-origin',
                    body: formData
                });

                // Verificar tipo de contenido
                const contentType = resp.headers.get('content-type') || '';
                if (!contentType.includes('application/json')) {
                    throw new Error('El servidor no devolvió JSON.');
                }

                const data = await resp.json();

                if (data && data.success) {
                    // Éxito: cerrar modal si existe
                    const modalEl = form.closest('.modal');
                    if (modalEl) {
                        if (typeof $ !== 'undefined' && $.fn.modal) {
                            $(modalEl).modal('hide');
                        } else {
                            modalEl.classList.remove('show');
                            modalEl.style.display = 'none';
                            const backdrop = document.querySelector('.modal-backdrop');
                            if (backdrop) backdrop.remove();
                            document.body.classList.remove('modal-open');
                            document.body.style.overflow = '';
                        }
                    }
                    mostrarPopupExito(data.message || '¡Gracias por tu valoración!', selected);
                } else {
                    const msg = data && data.message ? data.message : 'Error al enviar la valoración.';
                    mostrarPopupError(msg);
                }
            } catch (err) {
                console.error('Error de red:', err);
                mostrarPopupError('Error de red al enviar la valoración: ' + err.message);
            } finally {
                if(submitBtn) {
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            }
        });
    });

    // Funciones de Popup
    window.mostrarPopupExito = function(mensaje, estrellas) {
        const overlay = document.createElement('div');
        overlay.className = 'success-popup-overlay';
        const estrellasHTML = '★'.repeat(estrellas) + '☆'.repeat(5 - estrellas);
        
        overlay.innerHTML = `
            <div class="success-popup">
                <div class="success-popup-icon">🎉</div>
                <div class="success-popup-title">¡Valoración enviada!</div>
                <div class="success-popup-message">${mensaje}</div>
                <div style="color: #fbbf24; font-size: 1.5rem; margin-bottom: 1.5rem;">${estrellasHTML}</div>
                <button class="success-popup-btn" onclick="window.location.reload()">Aceptar</button>
            </div>
        `;
        document.body.appendChild(overlay);
    };

    window.mostrarPopupError = function(mensaje) {
        const overlay = document.createElement('div');
        overlay.className = 'success-popup-overlay';
        overlay.innerHTML = `
            <div class="success-popup" style="background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);">
                <div class="success-popup-icon">⚠️</div>
                <div class="success-popup-title">Error</div>
                <div class="success-popup-message">${mensaje}</div>
                <button class="success-popup-btn" style="color: #ff6b6b;" onclick="this.closest('.success-popup-overlay').remove()">Cerrar</button>
            </div>
        `;
        document.body.appendChild(overlay);
    };
});
</script>
