{% extends 'accounts/base.html' %}

{% block title %}Pago Rechazado - {{ configuracion_cine.nombre|default:"CineGest" }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="text-center">
        <div class="mb-4">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#dc3545" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
        </div>
        <h2 class="mb-3">Pago no procesado</h2>
        <p class="text-muted mb-4">El pago no pudo ser completado</p>
        
        <div class="d-flex gap-2 justify-content-center">
            <a href="{% url 'ventas:iniciar_pago' venta.id_venta %}" class="btn btn-primary btn-lg">Intentar nuevamente</a>
            <a href="{% url 'cine:cartelera' %}" class="btn btn-outline-secondary btn-lg">Volver a cartelera</a>
        </div>
    </div>
</div>
{% endblock %}
